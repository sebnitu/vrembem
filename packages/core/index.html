<!DOCTYPE html>
<html lang="en" data-mode="auto">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>%VITE_NAME%</title>
  <link rel="icon" type="image/png" href="https://sebnitu.com/icons/vb-favicon.png">
  <link rel="icon" type="image/svg+xml" href="https://sebnitu.com/icons/vb-favicon.svg">
  <script>
    (function () {
      const local = localStorage.getItem("VB:Profile");
      const store = local ? JSON.parse(local) : {};
      document.documentElement.dataset.mode = store.mode || "auto";
    })();
  </script>
  <script type="module">
    import "vrembem/sass";

    /**
     * Create custom elements
     */

    customElements.define("vb-palette-variants", class extends HTMLElement {
      static _injectStyles = true;

      connectedCallback() {
        // Only inject the styles once
        if (this.constructor._injectStyles) {
          this.constructor._injectStyles = false;
          const style = document.createElement("style");
          style.textContent = `
            vb-palette-variants {
              display: flex;

              & div {
                height: 4rem;
                flex: auto;
              }
            }
          `.replace(/\s+/g, " ").trim();
          document.head.appendChild(style);
        }

        // Get the provided color
        const color = this.getAttribute("color");

        // Build the variant markup
        this.innerHTML = `
          <div class="background-${color}-50"></div>
          <div class="background-${color}-75"></div>
          <div class="background-${color}-100"></div>
          <div class="background-${color}-200"></div>
          <div class="background-${color}-300"></div>
          <div class="background-${color}-400"></div>
          <div class="background-${color}-500"></div>
          <div class="background-${color}-600"></div>
          <div class="background-${color}-700"></div>
          <div class="background-${color}-800"></div>
          <div class="background-${color}-900"></div>
          <div class="background-${color}-950"></div>
        `;
      }
    });

    customElements.define("vb-swatch-content", class extends HTMLElement {
      connectedCallback() {
        this.innerHTML = `
          <p class="foreground-strong">foreground-strong</p>
          <p class="foreground">foreground</p>
          <p class="foreground-subtle">foreground-subtle</p>
          <p class="foreground-accent">foreground-accent</p>
          <p class="foreground-accent-alt">foreground-accent-alt</p>
        `;
      }
    });

    customElements.define("vb-palette-theme", class extends HTMLElement {
      static _injectStyles = true;

      connectedCallback() {
        // Only inject the styles once
        if (this.constructor._injectStyles) {
          this.constructor._injectStyles = false;
          const style = document.createElement("style");
          style.textContent = "vb-palette-theme { display: block; }";
          document.head.appendChild(style);
        }

        // Get the provided color
        const color = this.getAttribute("color");

        // Build the theme markup
        this.innerHTML = `
          <div class="grid grid--cols-2 grid--gap-0">
            <div data-mode="light" class="padding-lg background-${color}-auto foreground-${color}-auto">
              <p>--vb-${color}-background</p>
              <p>--vb-${color}-foreground</p>
            </div>
            <div data-mode="dark" class="padding-lg background-${color}-auto foreground-${color}-auto">
              <p>--vb-${color}-background</p>
              <p>--vb-${color}-foreground</p>
            </div>
          </div>
        `;
      }
    });
  </script>
</head>
<body>

  <header class="padding-lg background-shift">
    <div class="margin-auto max-width-xs spacing-sm">
      <h1 class="font-size-lg">%VITE_NAME%</h1>
      <p>%VITE_DESCRIPTION%</p>
      <ol class="foreground-subtle flex margin-top list-style-none">
        <li class="flex flex--gap-sm align-items-center">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 256 256"><path d="M212.62,75.17A63.7,63.7,0,0,0,206.39,26,12,12,0,0,0,196,20a63.71,63.71,0,0,0-50,24H126A63.71,63.71,0,0,0,76,20a12,12,0,0,0-10.39,6,63.7,63.7,0,0,0-6.23,49.17A61.5,61.5,0,0,0,52,104v8a60.1,60.1,0,0,0,45.76,58.28A43.66,43.66,0,0,0,92,192v4H76a20,20,0,0,1-20-20,44.05,44.05,0,0,0-44-44,12,12,0,0,0,0,24,20,20,0,0,1,20,20,44.05,44.05,0,0,0,44,44H92v12a12,12,0,0,0,24,0V192a20,20,0,0,1,40,0v40a12,12,0,0,0,24,0V192a43.66,43.66,0,0,0-5.76-21.72A60.1,60.1,0,0,0,220,112v-8A61.5,61.5,0,0,0,212.62,75.17ZM196,112a36,36,0,0,1-36,36H112a36,36,0,0,1-36-36v-8a37.87,37.87,0,0,1,6.13-20.12,11.65,11.65,0,0,0,1.58-11.49,39.9,39.9,0,0,1-.4-27.72,39.87,39.87,0,0,1,26.41,17.8A12,12,0,0,0,119.82,68h32.35a12,12,0,0,0,10.11-5.53,39.84,39.84,0,0,1,26.41-17.8,39.9,39.9,0,0,1-.4,27.72,12,12,0,0,0,1.61,11.53A37.85,37.85,0,0,1,196,104Z"></path></svg>
          <a class="link" target="_blank" href="https://github.com/sebnitu/%VITE_ROOT%">%VITE_ROOT%</a>
        </li>
        <li class="foreground-subtle">/</li>
        <li class="flex flex--gap-sm align-items-center">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 256 256"><path d="M225.6,62.64l-88-48.17a19.91,19.91,0,0,0-19.2,0l-88,48.17A20,20,0,0,0,20,80.19v95.62a20,20,0,0,0,10.4,17.55l88,48.17a19.89,19.89,0,0,0,19.2,0l88-48.17A20,20,0,0,0,236,175.81V80.19A20,20,0,0,0,225.6,62.64ZM128,36.57,200,76,178.57,87.73l-72-39.42Zm0,78.83L56,76,81.56,62l72,39.41ZM44,96.79l72,39.4v76.67L44,173.44Zm96,116.07V136.19l24-13.13V152a12,12,0,0,0,24,0V109.92l24-13.13v76.65Z"></path></svg>
          <a class="link" target="_blank" href="https://github.com/sebnitu/%VITE_ROOT%/tree/main/packages/%VITE_PACKAGE%#readme">%VITE_PACKAGE%</a>
        </li>
      </ol>
    </div>
  </header>

  <section class="padding-lg">
    <div class="margin-auto max-width-xs spacing">

      <vb-palette-variants color="primary"></vb-palette-variants>
      <vb-palette-variants color="secondary"></vb-palette-variants>
      <vb-palette-variants color="neutral"></vb-palette-variants>
      <vb-palette-variants color="important"></vb-palette-variants>

      <div class="grid grid--cols-2 grid--gap-0">
        <div data-mode="light">
          <div class="padding-lg background">
            <h2>[data-mode="light"]</h2>
            <hr class="divider margin-y" />
            <vb-swatch-content></vb-swatch-content>
          </div>
          <div class="padding-lg background-alt">
            <vb-swatch-content></vb-swatch-content>
          </div>
          <div class="padding-lg background-shift">
            <vb-swatch-content></vb-swatch-content>
          </div>
        </div>
        <div data-mode="dark">
          <div class="padding-lg background">
            <h2>[data-mode="dark"]</h2>
            <hr class="divider margin-y" />
            <vb-swatch-content></vb-swatch-content>
          </div>
          <div class="padding-lg background-alt">
            <vb-swatch-content></vb-swatch-content>
          </div>
          <div class="padding-lg background-shift">
            <vb-swatch-content></vb-swatch-content>
          </div>
        </div>
      </div>

      <vb-palette-theme color="primary"></vb-palette-theme>
      <vb-palette-theme color="secondary"></vb-palette-theme>
      <vb-palette-theme color="neutral"></vb-palette-theme>
      <vb-palette-theme color="important"></vb-palette-theme>

    </div>
  </section>

</body>
</html>
