  <section class="section">
    <div class="section__container max-width-xs spacing">
      
      <h2 id="drawer"><a href="#drawer">drawer</a></h2>

      <ul class="list">
        <li>
          <button 
            class="link" 
            type="button" 
            command="show-modal" 
            commandfor="custom-drawer-modal"
          >
            Show modal
          </button>
        </li>
      </ul>

      <vb-drawer id="custom-drawer" class="panel">
        <div class="panel__header">
          <h1 class="panel__title">Drawer</h1>
          <button 
            class="link" 
            type="button" 
            command="close" 
            commandfor="custom-drawer-modal"
          >
            Close
          </button>
        </div>
        <div class="panel__body">
          <p>This is the contents of a drawer...</p>
        </div>
        <div class="panel__footer">
          <p>Drawer footer</p>
        </div>
      </vb-drawer>

    </div>
