<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>%VITE_NAME%</title>
  <link rel="icon" type="image/png" href="https://sebnitu.com/icons/vb-favicon.png">
  <link rel="icon" type="image/svg+xml" href="https://sebnitu.com/icons/vb-favicon.svg">
  <script type="module">
    import "vrembem/sass";
    import * as core from "vrembem";

    class Drawer extends HTMLElement {
      #initialized = false;

      constructor() {
        super();
        this.mqList = null;
        this.mqHandler = (event) => this.evaluateLayout(event.matches);
      }

      static {
        const sheet = new CSSStyleSheet();
        sheet.replaceSync(`
          vb-drawer { display: block; }
          vb-drawer.is-modal { display: contents; }
          vb-drawer.is-modal > :not(dialog) { display: none; }
        `);
        document.adoptedStyleSheets.push(sheet);
      }

      static get observedAttributes() {
        return ["breakpoint", "position"];
      }

      attributeChangedCallback(name, oldValue, newValue) {
        if ((oldValue === newValue) || !this.#initialized) return;
        if (name === "breakpoint") {
          this.setupMediaQuery(newValue);
        }
        if (name === "position") {
          this.applyPosition(oldValue, newValue);
        }
      }

      connectedCallback() {
        // Create internal structure
        this.drawerModal = document.createElement("dialog");

        // Setup the modal attributes
        this.drawerModal.setAttribute("id", `${this.getAttribute("id")}-modal`);
        this.drawerModal.setAttribute("closedby", "any");

        // Apply modal component and drawer modifier
        this.drawerModal.classList.add("modal", "modal--drawer");

        // Apply the initial position modifier
        const pos = this.getAttribute("position") || "bottom";
        this.applyPosition(null, pos);

        // Apply panel component to dialog modal
        this.drawerModal.classList.add("panel");

        // Append the containers inside the custom element
        this.appendChild(this.drawerModal);

        const bp = this.getAttribute("breakpoint") || "600px";
        this.setupMediaQuery(bp);

        // Set the initialized flag
        this.#initialized = true;
      }

      disconnectedCallback() {
        this.teardownMediaQuery();
      }

      setupMediaQuery(bp) {
        this.teardownMediaQuery();

        // Check if the breakpoint is the key of a custom property
        const customProp = getComputedStyle(document.body)
          .getPropertyValue(`--${core.getPrefix("-")}breakpoint-${bp}`)
          .trim();
        bp = customProp || bp;

        // Process the bp value to always make it a px value
        const bpFormatted = /^\d+$/.test(bp) ? `${bp}px` : bp;

        // Setup and initial run of mediaquery list
        this.mqList = window.matchMedia(`(min-width: ${bpFormatted})`);
        this.mqList.addEventListener("change", this.mqHandler);
        this.evaluateLayout(this.mqList.matches);
      }

      teardownMediaQuery() {
        if (this.mqList) {
          this.mqList.removeEventListener("change", this.mqHandler);
          this.mqList = null;
        }
      }

      evaluateLayout(matches) {
        if (matches) {
          // Toggle state classes
          this.classList.remove("is-modal");

          // Close the modal if it's open
          if (this.drawerModal.hasAttribute("open")) {
            this.drawerModal.close();
          }

          // Move children outside of the drawer modal
          while (this.drawerModal.firstChild) {
            this.drawerModal.before(this.drawerModal.firstChild);
          }
        } else {
          // Toggle state classes
          this.classList.add("is-modal");

          // Move children to modal
          while (this.firstChild && this.firstChild !== this.drawerModal) {
            this.drawerModal.appendChild(this.firstChild);
          }
        }
      }

      applyPosition(oldPos, newPos) {
        if (oldPos) this.drawerModal.classList.remove(`modal--pos-${oldPos}`);
        this.drawerModal.classList.add(`modal--pos-${newPos}`);
      }
    }

    customElements.define("vb-drawer", Drawer);
  </script>
</head>
<body>

  <header class="section background-shift">
    <div class="section__container max-width-xs spacing-sm">
      <h1 class="font-size-lg">%VITE_NAME%</h1>
      <p>%VITE_DESCRIPTION%</p>
      <ol class="foreground-subtle flex flex--gap-y-sm margin-top list-style-none">
        <li class="flex flex--gap-sm align-items-center">
          <svg class="icon icon--size-sm" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"></path></svg>
          <a class="link" target="_blank" href="https://github.com/sebnitu/%VITE_ROOT%">%VITE_ROOT%</a>
        </li>
        <li class="foreground-subtle">/</li>
        <li class="flex flex--gap-sm align-items-center">
          <svg class="icon icon--size-sm" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="16.5" y1="9.4" x2="7.5" y2="4.21"></line><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>
          <a class="link" target="_blank" href="https://github.com/sebnitu/%VITE_ROOT%/tree/main/packages/%VITE_PACKAGE%#readme">%VITE_PACKAGE%</a>
        </li>
      </ol>
    </div>
  </header>

  <section class="section">
    <div class="section__container max-width-xs spacing">
      
      <h2 id="drawer"><a href="#drawer">drawer</a></h2>

      <ul class="list">
        <li>
          <button 
            class="link" 
            type="button" 
            command="show-modal" 
            commandfor="custom-drawer-modal"
          >
            Show modal
          </button>
        </li>
      </ul>

      <vb-drawer id="custom-drawer" class="panel" breakpoint="lg" position="left">
        <div class="panel__body">
          <p>This is the contents of a drawer...</p>
          <ul class="list">
            <li>
              <button 
                class="link" 
                type="button" 
                command="close" 
                commandfor="custom-drawer-modal"
              >
                Close modal
              </button>
            </li>
          </ul>
        </div>
      </vb-drawer>

    </div>
  </section>

</body>
</html>
